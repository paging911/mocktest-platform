{% extends "templates/web.html" %}

{% block page_content %}
<div class="container my-4" id="mock-test-app">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0" id="exam-title">Mock Test</h1>
    <div class="badge bg-dark" id="timer">--:--</div>
  </div>

  <div class="row">
    <div class="col-lg-8">
      <div class="card">
        <div class="card-body">
          <div class="text-muted small mb-2" id="question-meta"></div>
          <div class="mb-3" id="question-text"></div>
          <div id="options"></div>
          <div class="d-flex gap-2 mt-4">
            <button class="btn btn-outline-secondary" id="review-btn">Mark for Review</button>
            <button class="btn btn-primary" id="save-next-btn">Save and Next</button>
            <button class="btn btn-outline-danger ms-auto" id="submit-btn">Submit</button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-4 mt-3 mt-lg-0">
      <div class="card">
        <div class="card-body">
          <h2 class="h6">Questions</h2>
          <div class="d-flex flex-wrap gap-2" id="palette"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const attemptName = "{{ attempt }}";
let attemptData = null;
let currentIndex = 0;
let markedForReview = false;
let submitted = false;

frappe.ready(() => {
  loadAttempt();
  document.getElementById("save-next-btn").addEventListener("click", saveAndNext);
  document.getElementById("review-btn").addEventListener("click", toggleReview);
  document.getElementById("submit-btn").addEventListener("click", submitAttempt);
});

function loadAttempt() {
  frappe.call({
    method: "mocktest_platform.api.get_attempt",
    args: { attempt: attemptName },
    callback(response) {
      attemptData = response.message;
      document.getElementById("exam-title").textContent = attemptData.title;
      renderQuestion();
      renderPalette();
      startTimer();
    }
  });
}

function renderQuestion() {
  const question = attemptData.questions[currentIndex];
  markedForReview = Boolean(question.marked_for_review);
  document.getElementById("question-meta").textContent = `${question.section || "General"} · Question ${currentIndex + 1} of ${attemptData.questions.length}`;
  document.getElementById("question-text").innerHTML = question.question_text;
  document.getElementById("review-btn").textContent = markedForReview ? "Unmark Review" : "Mark for Review";

  const options = document.getElementById("options");
  options.innerHTML = "";
  question.options.forEach(option => {
    const id = `option-${option.option_id}`;
    const checked = question.selected_option === option.option_id ? "checked" : "";
    options.insertAdjacentHTML("beforeend", `
      <label class="d-block border rounded p-2 mb-2" for="${id}">
        <input type="radio" id="${id}" name="selected-option" value="${option.option_id}" ${checked}>
        <strong>${option.label}.</strong> ${option.text}
      </label>
    `);
  });
}

function renderPalette() {
  const palette = document.getElementById("palette");
  palette.innerHTML = "";
  attemptData.questions.forEach((question, index) => {
    const active = index === currentIndex ? "btn-primary" : "btn-outline-secondary";
    palette.insertAdjacentHTML("beforeend", `
      <button class="btn btn-sm ${active}" onclick="jumpToQuestion(${index})">${index + 1}</button>
    `);
  });
}

function jumpToQuestion(index) {
  currentIndex = index;
  renderQuestion();
  renderPalette();
}

function toggleReview() {
  markedForReview = !markedForReview;
  document.getElementById("review-btn").textContent = markedForReview ? "Unmark Review" : "Mark for Review";
}

function selectedOption() {
  const input = document.querySelector("input[name='selected-option']:checked");
  return input ? input.value : null;
}

function saveAndNext() {
  const question = attemptData.questions[currentIndex];
  frappe.call({
    method: "mocktest_platform.api.save_answer",
    args: {
      attempt: attemptName,
      answer_row: question.answer_row,
      selected_option: selectedOption(),
      marked_for_review: markedForReview ? 1 : 0
    },
    callback() {
      question.selected_option = selectedOption();
      question.marked_for_review = markedForReview;
      if (currentIndex < attemptData.questions.length - 1) {
        currentIndex += 1;
      }
      renderQuestion();
      renderPalette();
    }
  });
}

function submitAttempt(skipConfirm = false) {
  if (submitted) {
    return;
  }

  const submit = () => {
    submitted = true;
    frappe.call({
      method: "mocktest_platform.api.submit_attempt",
      args: { attempt: attemptName },
      callback(response) {
        const result = response.message;
        frappe.msgprint(`Score: ${result.total_score} / ${result.max_score}`);
        window.location.href = `/mock-test-result/${attemptName}`;
      }
    });
  };

  if (skipConfirm) {
    submit();
  } else {
    frappe.confirm("Submit this test?", submit);
  }
}

function startTimer() {
  const started = new Date(attemptData.started_at).getTime();
  const duration = attemptData.duration_minutes * 60 * 1000;
  const timer = document.getElementById("timer");

  setInterval(() => {
    const remaining = Math.max(0, started + duration - Date.now());
    const minutes = Math.floor(remaining / 60000);
    const seconds = Math.floor((remaining % 60000) / 1000);
    timer.textContent = `${minutes}:${String(seconds).padStart(2, "0")}`;

    if (remaining <= 0) {
      submitAttempt(true);
    }
  }, 1000);
}
</script>
{% endblock %}
